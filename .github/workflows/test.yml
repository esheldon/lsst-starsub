name: tests

on:
  push:
    branches:
      - master
  pull_request: null

jobs:
  tests:
    name: tests
    strategy:
      fail-fast: false
      matrix:
        pyver: ["3.12", "3.13", "3.14"]

    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.pyver }}
          channels: conda-forge
          channel-priority: strict
          show-channel-urls: true
          miniforge-version: latest

      - name: install deps and code
        shell: bash -l {0}
        run: |
          conda config --set always_yes yes
          # the characterization and profile code and the tests run
          # without the LSST science pipelines (needed only by the
          # butler loaders and the command line), so none here
          conda install --quiet \
            pip \
            setuptools \
            numpy \
            scipy \
            matplotlib-base \
            astropy \
            sep \
            ngmix \
            rustfits \
            pytest \
            pytest-cov \
            ruff

          # --no-deps so pip never pulls packages over the conda
          # environment
          python -m pip install --no-deps -e .

      - name: lint
        shell: bash -l {0}
        run: |
          ruff check lsst_starsub/
          ruff check tests/
          ruff check scripts/

      - name: test
        shell: bash -l {0}
        run: |
          OMP_NUM_THREADS=1 pytest -v --cov=lsst_starsub --cov-report=term
