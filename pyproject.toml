[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lsst_starsub"
version = "0.1.0"
description = "bright-star wing and sky characterization on LSST visit images"
requires-python = ">=3.11"

[project.scripts]
lsst-starsub-visit = "lsst_starsub.cli.run_visit:main"
lsst-starsub-stack = "lsst_starsub.cli.stack:main"
lsst-starsub-remeasure = "lsst_starsub.cli.remeasure:main"
lsst-starsub-make-slurm = "lsst_starsub.cli.make_slurm:main"
lsst-starsub-cell-restore = "lsst_starsub.cli.cell_restore:main"
lsst-starsub-make-slurm-cells = "lsst_starsub.cli.make_slurm_cells:main"
lsst-starsub-check-datasets = "lsst_starsub.cli.check_datasets:main"
lsst-starsub-forward-check = "lsst_starsub.cli.forward_check:main"
lsst-starsub-visit-template = "lsst_starsub.cli.visit_template:main"
lsst-starsub-make-slurm-template = "lsst_starsub.cli.make_slurm_template:main"
lsst-starsub-cell-forward = "lsst_starsub.cli.cell_forward:main"
lsst-starsub-cell-clean = "lsst_starsub.cli.cell_clean:main"
lsst-starsub-sim = "lsst_starsub.cli.sim:main"

[tool.setuptools.packages.find]
include = ["lsst_starsub*"]

# ruff configuration lives in .ruff.toml
